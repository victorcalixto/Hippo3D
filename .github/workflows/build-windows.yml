name: Build Windows addon

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIP to the wip-0.3.0 GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  OCCT_VERSION: '8.0.0'
  TARGET_VERSION: '0.3.0'
  FLAVOR: 'wip'
  HIPPO_PLATFORM: 'windows-x64'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11.9', '3.13.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The repo currently references an opennurbs commit that does not exist on
      # the public remote. Reset to the last known buildable commit.
      - name: Fix opennurbs submodule
        shell: bash
        run: |
          cd native/third_party/opennurbs
          git fetch origin
          git checkout 2fc39db962678b44ee710f887a04fc38f8d4b883

      - name: Download portable Blender for Python ABI match
        shell: pwsh
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          $pyShort = "${env:PYTHON_VERSION}".Replace(".", "").Substring(0, 3)
          # Windows users report:
          #   Blender 5.0 -> Python 3.11
          #   Blender 5.2 -> Python 3.13
          switch ($pyShort) {
            "311" { $blenderVer = "5.0" }
            "313" { $blenderVer = "5.2" }
            default { throw "Unsupported Python version $env:PYTHON_VERSION" }
          }
          $url = "https://download.blender.org/release/Blender${blenderVer}/blender-${blenderVer}.0-windows-x64.zip"
          $archive = "$env:TEMP\blender-${blenderVer}.0-windows-x64.zip"
          Write-Host "Downloading Blender ${blenderVer} portable for Python ${env:PYTHON_VERSION} ..."
          curl.exe -L -o $archive $url --max-time 600
          if (-not (Test-Path $archive)) { throw "Failed to download Blender portable" }
          Expand-Archive -Path $archive -DestinationPath "C:\BlenderPy" -Force
          $blenderRoot = (Get-ChildItem -Path "C:\BlenderPy" -Directory | Select-Object -First 1).FullName
          $blenderPy = Join-Path $blenderRoot "$blenderVer\python\bin\python.exe"
          if (-not (Test-Path $blenderPy)) {
            $blenderPy = Join-Path $blenderRoot "python\bin\python.exe"
          }
          if (-not (Test-Path $blenderPy)) { throw "Blender python.exe not found under $blenderRoot" }
          "BLENDER_PYTHON=$blenderPy" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "BLENDER_PYTHON=$blenderPy"

      # Blender's portable Python has no development headers/libs, so we also
      # need a matching standalone Python installation that provides
      # include/Python.h and pythonXY.lib for the C++ extension build.
      - name: Install matching Python development files
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Expose Python dev tree and install pybind11 into Blender Python
        shell: pwsh
        run: |
          # Use the standalone Python (with headers/libs) for the C++ build.
          $py = (Get-Command python).Source
          $dev = Split-Path $py -Parent
          "PYTHON_DEV_DIR=$dev" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PYTHON_DEV_DIR=$dev"
          # Install pybind11 into Blender's bundled Python so its CMake files
          # and the module's runtime site-packages match Blender's interpreter.
          & "$env:BLENDER_PYTHON" -m pip install --upgrade pip pybind11
          & "$env:BLENDER_PYTHON" --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify MSVC tools
        shell: pwsh
        run: |
          Get-Command cl -ErrorAction Stop
          Get-Command cmake -ErrorAction Stop
          cl

      - name: Download and install OCCT ${{ env.OCCT_VERSION }}
        shell: pwsh
        run: |
          $occtBase = "C:\OCCT"
          $thirdPartyBase = "C:\OCCT3rdparty"
          New-Item -ItemType Directory -Force -Path $occtBase | Out-Null
          New-Item -ItemType Directory -Force -Path $thirdPartyBase | Out-Null

          # OCCT no longer ships the old vc14-64 installer/7z on GitHub releases.
          # The prebuilt Windows binaries are now published as zip archives.
          $occtZip = "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/opencascade-release-no-pch.zip"
          $thirdPartyZip = "https://github.com/Open-Cascade-SAS/OCCT/releases/download/V8_0_0/3rdparty-vc14-64.zip"
          $occtArchive = "$env:TEMP\opencascade-release-no-pch.zip"
          $thirdPartyArchive = "$env:TEMP\3rdparty-vc14-64.zip"

          # Download OCCT release binaries
          curl.exe -L -o $occtArchive $occtZip --max-time 600
          if (-not (Test-Path $occtArchive)) { throw "Failed to download OCCT release binaries" }

          # Download 3rdparty binaries (FreeImage, FreeType, TBB, etc.)
          curl.exe -L -o $thirdPartyArchive $thirdPartyZip --max-time 600
          if (-not (Test-Path $thirdPartyArchive)) { throw "Failed to download OCCT 3rdparty binaries" }

          # Both OCCT and 3rdparty archives are zip-of-a-zip. Extract outer
          # archives into temp locations, then extract the inner archives.
          Expand-Archive -Path $occtArchive -DestinationPath "$env:TEMP\occt_extract" -Force
          Expand-Archive -Path $thirdPartyArchive -DestinationPath "$env:TEMP\3rdparty_extract" -Force

          $innerOcct = (Get-ChildItem -Path "$env:TEMP\occt_extract" -Filter "*.zip" | Select-Object -First 1).FullName
          Expand-Archive -Path $innerOcct -DestinationPath $occtBase -Force

          $innerThirdParty = (Get-ChildItem -Path "$env:TEMP\3rdparty_extract" -Filter "*.zip" | Select-Object -First 1).FullName
          Expand-Archive -Path $innerThirdParty -DestinationPath $thirdPartyBase -Force

          # Locate the actual OCCT root by searching for the headers.
          $occtRoot = (Get-ChildItem -Path $occtBase -Recurse -Filter "BRepPrimAPI_MakeBox.hxx" | Select-Object -First 1).DirectoryName
          if (-not $occtRoot) {
            throw "OCCT headers not found under $occtBase"
          }
          $occtRoot = Split-Path $occtRoot -Parent
          if (-not (Test-Path "$occtRoot\inc\BRepPrimAPI_MakeBox.hxx")) {
            throw "OCCT headers not found at $occtRoot"
          }

          # 3rdparty folder should live next to the OCCT root (or as a sibling)
          $occtParent = Split-Path $occtRoot -Parent
          $thirdPartyDir = Join-Path $occtParent "3rdparty-vc14-64"
          if (-not (Test-Path $thirdPartyDir)) {
            # Fallback: search under the extraction base
            $thirdPartyDir = (Get-ChildItem -Path $thirdPartyBase -Directory | Select-Object -First 1).FullName
          }
          if (-not $thirdPartyDir) {
            throw "Could not locate extracted 3rdparty-vc14-64 directory"
          }

          "OCCT_ROOT=$occtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "3RDPARTY_DIR=$thirdPartyDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "OCCT_ROOT=$occtRoot"
          Write-Host "3RDPARTY_DIR=$thirdPartyDir"

      - name: Build Hippo3D native module
        shell: pwsh
        run: |
          $env:OCCT_ROOT = $env:OCCT_ROOT
          $env:3RDPARTY_DIR = $env:3RDPARTY_DIR
          cd native
          .\build_windows.ps1 -PythonExecutable "$env:BLENDER_PYTHON" -PlatformFolder "$env:HIPPO_PLATFORM"

      - name: Package add-on
        shell: pwsh
        run: |
          $parts = "${{ matrix.python_version }}".Split(".")
          $pyShort = $parts[0] + $parts[1]
          $zipName = "Hippo3D-v${env:TARGET_VERSION}-${env:FLAVOR}-${env:HIPPO_PLATFORM}-python${pyShort}"
          .\package_addon.ps1 -Platform "$env:HIPPO_PLATFORM" -ZipName "$zipName" -PythonVersion "${{ matrix.python_version }}"

      - name: Verify ZIP exists
        shell: pwsh
        run: |
          $parts = "${{ matrix.python_version }}".Split(".")
          $pyShort = $parts[0] + $parts[1]
          $zip = "dist\Hippo3D-v${env:TARGET_VERSION}-${env:FLAVOR}-${env:HIPPO_PLATFORM}-python${pyShort}.zip"
          if (-not (Test-Path $zip)) { throw "ZIP not found: $zip" }
          Get-Item $zip

      - name: Smoke-test native module import
        shell: pwsh
        run: |
          $parts = "${{ matrix.python_version }}".Split(".")
          $pyShort = $parts[0] + $parts[1]
          $zip = "dist\Hippo3D-v${env:TARGET_VERSION}-${env:FLAVOR}-${env:HIPPO_PLATFORM}-python${pyShort}.zip"
          $tmp = "$env:TEMP\hippo_test"
          $extractRoot = "$tmp\Hippo3D"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extractRoot -Force
          # The packaged ZIP contents are at the top level, so after extracting
          # into $extractRoot the native folder is $extractRoot\native.
          $nativeDir = "$extractRoot\native\$env:HIPPO_PLATFORM"
          if (-not (Test-Path $nativeDir)) {
              Write-Host "Expected native dir not found. Listing extraction tree:"
              Get-ChildItem -Recurse $extractRoot | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "Native module directory not found: $nativeDir"
          }
          $env:PATH = "$nativeDir;" + $env:PATH
          $mod = Get-ChildItem -Path $nativeDir -Filter "hippo_occ_core*.pyd" | Sort-Object Name | Select-Object -Last 1
          if (-not $mod) {
              Write-Host "No .pyd in $nativeDir. Listing contents:"
              Get-ChildItem -Recurse $nativeDir | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "No native module found in $nativeDir"
          }
          $modPath = $mod.FullName
          Write-Host "Testing import of" $modPath
          $diagFile = "$env:TEMP\hippo_diag.py"
          $nativeDirEscaped = "$nativeDir" -replace '\\', '\\'
          $modPathEscaped = "$modPath" -replace '\\', '\\'
          $diagCode = @'
          import sys, os, ctypes, glob, importlib.util
          native_dir = r'NATIVE_DIR'
          pyd = r'MOD_PATH'
          print('Native dir:', native_dir)
          print('PYD:', pyd)
          print('Python:', sys.executable)
          print('cwd:', os.getcwd())
          if hasattr(os, 'add_dll_directory'):
              os.add_dll_directory(native_dir)
              print('Added dll directory')
          print('Files in native dir:')
          for f in sorted(os.listdir(native_dir)): print(' ', f)
          # Try loading each DLL individually to find the missing one
          for dll in sorted(glob.glob(os.path.join(native_dir, '*.dll'))):
              try:
                  ctypes.WinDLL(dll)
              except Exception as e:
                  print(f'FAILED to load {os.path.basename(dll)}: {e}')
              else:
                  print(f'OK {os.path.basename(dll)}')
          # Try loading the pyd with ctypes for a clearer error
          print('Trying ctypes.WinDLL on pyd...')
          try:
              ctypes.WinDLL(pyd)
              print('ctypes pyd OK')
          except Exception as e:
              print(f'ctypes pyd FAILED: {e}')
          # Finally try the importlib route
          print('Trying importlib import...')
          sys.path.insert(0, native_dir)
          spec = importlib.util.spec_from_file_location('hippo_occ_core', pyd)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['hippo_occ_core'] = mod
          spec.loader.exec_module(mod)
          print('SUCCESS:', mod.make_box_mesh(1,1,1).keys())
          '@
          $diagCode = $diagCode -replace 'NATIVE_DIR', $nativeDirEscaped
          $diagCode = $diagCode -replace 'MOD_PATH', $modPathEscaped
          Set-Content -Path $diagFile -Value $diagCode
          
          & "$env:BLENDER_PYTHON" $diagFile

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HIPPO_PLATFORM }}-python${{ matrix.python_version }}-addon
          path: dist\Hippo3D-v${{ env.TARGET_VERSION }}-${{ env.FLAVOR }}-${{ env.HIPPO_PLATFORM }}-python*.zip

      - name: Upload to GitHub release
        if: github.event.inputs.upload_to_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parts = "${{ matrix.python_version }}".Split(".")
          $pyShort = $parts[0] + $parts[1]
          gh release upload "wip-${env:TARGET_VERSION}" "dist\Hippo3D-v${env:TARGET_VERSION}-${env:FLAVOR}-${env:HIPPO_PLATFORM}-python${pyShort}.zip" --clobber
