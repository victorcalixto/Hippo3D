name: Build OpenBSD addon

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIP to the wip-0.3.0 GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  TARGET_VERSION: '0.3.0'
  FLAVOR: 'wip'
  HIPPO_PLATFORM: 'openbsd-x64'

jobs:
  build-openbsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start OpenBSD VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: openbsd
          version: '7.9'
          architecture: x86-64
          shell: bash
          memory: 6G
          cpu_count: 4

      - name: Install dependencies and build in OpenBSD VM
        shell: cpa.sh {0} --environment-variables TARGET_VERSION FLAVOR HIPPO_PLATFORM PYTHON_VERSION
        env:
          TARGET_VERSION: ${{ env.TARGET_VERSION }}
          FLAVOR: ${{ env.FLAVOR }}
          HIPPO_PLATFORM: ${{ env.HIPPO_PLATFORM }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          set -euo pipefail
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR}"

          # OpenBSD ships OCCT 7.9.x in ports; the Hippo3D CMake will use the
          # system OpenCASCADE if no local OCCT 8.0.0 is present.
          # pybind11 is installed via pip inside the build script if needed.
          pkg_add git cmake ninja "python--%${PYTHON_VERSION}" opencascade zip

          cd "$GITHUB_WORKSPACE/native/third_party/opennurbs"
          git fetch origin
          git checkout 2fc39db962678b44ee710f887a04fc38f8d4b883

          cd "$GITHUB_WORKSPACE/native"
          PYTHON_BIN="/usr/local/bin/python${PYTHON_VERSION}" BUNDLE_AUTO=1 ./build_openbsd.sh

          cd "$GITHUB_WORKSPACE/native"
          chmod +x ./package_bsd.sh
          VERSION="$TARGET_VERSION" FLAVOR="$FLAVOR" PLATFORM="$HIPPO_PLATFORM" ZIP_BASE="Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}" ./package_bsd.sh

      - name: Verify ZIP exists
        run: |
          PY_TAG="${PYTHON_VERSION%%.*}${PYTHON_VERSION#*.}"
          ls -lh "$GITHUB_WORKSPACE/dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}.zip"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HIPPO_PLATFORM }}-python${{ matrix.python_version }}-addon
          path: dist/Hippo3D-v${{ env.TARGET_VERSION }}-${{ env.FLAVOR }}-${{ env.HIPPO_PLATFORM }}-python*.zip

      - name: Upload to GitHub release
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_TAG="${PYTHON_VERSION%%.*}${PYTHON_VERSION#*.}"
          gh release upload "wip-${TARGET_VERSION}" \
            "dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}.zip" --clobber
