name: Build Linux addon

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIP to the wip-0.3.0 GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  OCCT_VERSION: '8.0.0'
  TARGET_VERSION: '0.3.0'
  FLAVOR: 'wip'
  PLATFORM: 'linux-x64'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.11.15', '3.13.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The repo currently references an opennurbs commit that does not exist on
      # the public remote. Reset to the last known buildable commit.
      - name: Fix opennurbs submodule
        run: |
          cd native/third_party/opennurbs
          git fetch origin
          git checkout 2fc39db962678b44ee710f887a04fc38f8d4b883

      # GitHub-hosted runners sometimes get stuck on the Azure Ubuntu mirror.
      # Force the main archive and use retries/timeouts so apt cannot hang.
      - name: Fix Ubuntu mirror
        run: |
          echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo apt-get install -y \
            cmake ninja-build build-essential \
            python3-dev python3-pip python3-venv \
            libfreetype6-dev libfontconfig1-dev libxmu-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libfreeimage-dev \
            git zip curl patchelf

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install pybind11
        run: |
          python -m pip install --upgrade pip pybind11
          echo "PYTHON_BIN=$(which python)" >> "$GITHUB_ENV"

      - name: Build OCCT ${{ env.OCCT_VERSION }}
        run: |
          chmod +x native/build_occt.sh
          ./native/build_occt.sh
          echo "OCCT_ROOT=$(pwd)/native/third_party/occt-${{ env.OCCT_VERSION }}" >> "$GITHUB_ENV"

      - name: Build Hippo3D native module
        run: |
          chmod +x native/build_linux.sh
          cd native
          PYTHON_BIN="$PYTHON_BIN" BUNDLE_AUTO=1 ./build_linux.sh

      - name: Package add-on
        run: |
          chmod +x package_addon.sh
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          ZIP_BASE="Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${PLATFORM}-python${PY_TAG}"
          VERSION="$TARGET_VERSION" FLAVOR="$FLAVOR" PLATFORM="$PLATFORM" PYTHON_VERSION="$PYTHON_VERSION" ZIP_BASE="$ZIP_BASE" OUTPUT_DIR="$(pwd)/dist" ./package_addon.sh
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Verify ZIP exists
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          ls -lh "dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${PLATFORM}-python${PY_TAG}.zip"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Smoke-test native module import
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          ZIP="dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${PLATFORM}-python${PY_TAG}.zip"
          TMPDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMPDIR"
          NATIVE_DIR="$TMPDIR/Hippo3D/native/${PLATFORM}"
          python - "$NATIVE_DIR" <<'PY'
          import sys, glob, os, importlib.util
          native_dir = sys.argv[1]
          mods = sorted(glob.glob(native_dir + '/hippo_occ_core*.so'))
          if not mods:
              raise SystemExit('No native module found')
          mod_path = mods[-1]
          print('Testing import of', mod_path)
          spec = importlib.util.spec_from_file_location('hippo_occ_core', mod_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['hippo_occ_core'] = mod
          spec.loader.exec_module(mod)
          print('SUCCESS:', mod.make_box_mesh(1,1,1).keys())
          PY
          rm -rf "$TMPDIR"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLATFORM }}-python${{ matrix.python_version }}-addon
          path: dist/Hippo3D-v${{ env.TARGET_VERSION }}-${{ env.FLAVOR }}-${{ env.PLATFORM }}-python*.zip

      - name: Clean up stale release assets
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          chmod +x .github/scripts/cleanup_release_assets.sh
          .github/scripts/cleanup_release_assets.sh "$TARGET_VERSION" "$FLAVOR" "$PLATFORM" "$PY_TAG"

      - name: Upload to GitHub release
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          gh release upload "wip-${TARGET_VERSION}" \
            "dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${PLATFORM}-python${PY_TAG}.zip" --clobber
