name: Build and Package All Platforms

# Triggers: push to main branches, pull requests, manual dispatch, and release creation.
on:
  push:
    branches: [master, main, dev, ci-multi-platform]
    tags: ['v*']
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

env:
  OCCT_VERSION: "8.0.0"

jobs:
  # ========================================================================
  # 1. Linux x64
  # ========================================================================
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache OCCT build
        id: cache-occt-linux
        uses: actions/cache@v4
        with:
          path: native/third_party/occt-8.0.0
          key: occt-${{ env.OCCT_VERSION }}-linux-${{ hashFiles('native/third_party/occt-8.0.0-src/**', 'native/build_occt.sh') }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Build OCCT from source (if not cached)
        if: steps.cache-occt-linux.outputs.cache-hit != 'true'
        run: |
          cd native
          bash build_occt.sh

      - name: Install pybind11
        run: pip install pybind11

      - name: Build native module
        run: |
          cd native
          bash build_linux.sh

      - name: Package add-on
        run: |
          bash package_addon.sh --platform linux-x64 --zip-name Hippo3D-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-linux-x64
          path: dist/Hippo3D-linux-x64.zip
          if-no-files-found: error

  # ========================================================================
  # 2. macOS Intel (x86_64)
  # ========================================================================
  macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS build dependencies
        run: |
          brew install cmake ninja opencascade pybind11 zip

      - name: Export OCCT_ROOT
        run: echo "OCCT_ROOT=$(brew --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Build native module
        run: |
          cd native
          bash build_macos.sh

      - name: Package add-on
        run: |
          bash package_addon.sh --platform macos-x64 --zip-name Hippo3D-macos-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-macos-x64
          path: dist/Hippo3D-macos-x64.zip
          if-no-files-found: error

  # ========================================================================
  # 3. macOS Silicon (arm64)
  # ========================================================================
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install macOS build dependencies
        run: |
          brew install cmake ninja opencascade pybind11 zip

      - name: Export OCCT_ROOT
        run: echo "OCCT_ROOT=$(brew --prefix opencascade)" >> "$GITHUB_ENV"

      - name: Build native module
        run: |
          cd native
          bash build_macos.sh

      - name: Package add-on
        run: |
          bash package_addon.sh --platform macos-arm64 --zip-name Hippo3D-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-macos-arm64
          path: dist/Hippo3D-macos-arm64.zip
          if-no-files-found: error

  # ========================================================================
  # 4. Windows x64
  # ========================================================================
  # NOTE: Windows CI requires a pre-installed OCCT build or a download step.
  # The easiest approach is to cache a prebuilt OCCT Windows package.
  # If you have a Windows OCCT build cached, uncomment and adjust this job.
  # For now, Windows CI is left as a documented template.
  # ========================================================================
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows build dependencies
        run: |
          choco install cmake ninja zip

      - name: Install pybind11
        run: pip install pybind11

      - name: Cache OCCT Windows build
        id: cache-occt-windows
        uses: actions/cache@v4
        with:
          path: native/third_party/occt-8.0.0
          key: occt-${{ env.OCCT_VERSION }}-windows-${{ hashFiles('native/third_party/occt-8.0.0-src/**') }}

      - name: Build OCCT from source on Windows (if not cached)
        if: steps.cache-occt-windows.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S native\third_party\occt-8.0.0-src -B native\occt-build -G "Ninja Multi-Config" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=native\third_party\occt-8.0.0 ^
            -DBUILD_LIBRARY_TYPE=Shared ^
            -DBUILD_MODULE_Draw=OFF ^
            -DBUILD_MODULE_Visualization=OFF ^
            -DBUILD_MODULE_DataExchange=ON ^
            -DBUILD_MODULE_FoundationClasses=ON ^
            -DBUILD_MODULE_ModelingData=ON ^
            -DBUILD_MODULE_ModelingAlgorithms=ON ^
            -DBUILD_MODULE_ShapeHealing=ON ^
            -DBUILD_MODULE_Mesh=ON ^
            -DBUILD_DOC_Overview=OFF ^
            -DBUILD_DOC_RefMan=OFF ^
            -DUSE_TKCAF=OFF ^
            -DUSE_TKOpenGl=OFF ^
            -DUSE_VTK=OFF ^
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON ^
            -DCMAKE_CXX_STANDARD=17
          cmake --build native\occt-build --config Release
          cmake --install native\occt-build --config Release

      - name: Build native module
        shell: powershell
        run: |
          cd native
          $env:PYTHON_DEV_DIR = (python -c "import sys; print(sys.prefix)")
          $env:OCCT_ROOT = "$pwd\third_party\occt-8.0.0"
          .\build_windows.ps1 -PlatformFolder windows-x64

      - name: Package add-on
        shell: powershell
        run: |
          .\package_addon.ps1 -Platform windows-x64 -ZipName Hippo3D-windows-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-windows-x64
          path: dist/Hippo3D-windows-x64.zip
          if-no-files-found: error

  # ========================================================================
  # 5. FreeBSD x64 (QEMU VM)
  # ========================================================================
  freebsd-x64:
    runs-on: ubuntu-latest
    # QEMU VMs are slower and occasionally flaky; allow failure so other jobs finish.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          prepare: |
            pkg install -y bash cmake ninja python311 py311-pip py311-pybind11 opencascade zip
          run: |
            export PYTHON_BIN=python3.11
            cd native
            bash build_freebsd.sh
            cd ..
            bash package_addon.sh --platform freebsd-x64 --zip-name Hippo3D-freebsd-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-freebsd-x64
          path: dist/Hippo3D-freebsd-x64.zip
          if-no-files-found: warn

  # ========================================================================
  # 6. OpenBSD x64 (QEMU VM)
  # ========================================================================
  # NOTE: OpenBSD does NOT have an OpenCASCADE binary package in ports.
  # Building OCCT from source inside a QEMU VM would take 30+ minutes and is
  # impractical for CI. This job attempts to build if OCCT is available;
  # otherwise it skips with a clear warning.
  # ========================================================================
  openbsd-x64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.6"
          usesh: true
          prepare: |
            pkg_add bash cmake ninja python3 py3-pip zip
            # OpenBSD currently lacks an OpenCASCADE package.
            # Try anyway in case it was added since this workflow was written.
            pkg_add opencascade 2>/dev/null || echo "OpenCASCADE not available as binary package on OpenBSD"
            pkg_add py3-pybind11 2>/dev/null || pip3 install pybind11
          run: |
            export PYTHON_BIN=python3
            cd native
            # Only build if OCCT is available
            if pkg_info 2>/dev/null | grep -qi opencascade; then
              bash build_openbsd.sh
              cd ..
              bash package_addon.sh --platform openbsd-x64 --zip-name Hippo3D-openbsd-x64
            else
              echo "WARNING: OpenCASCADE not found on OpenBSD. Skipping native build."
              echo "To support OpenBSD, either:"
              echo "  1. Contribute an OpenCASCADE port to OpenBSD ports tree,"
              echo "  2. Build OCCT from source manually on an OpenBSD machine,"
              echo "  3. Use a self-hosted runner with OCCT pre-installed."
              # Create a placeholder artifact so the workflow doesn't fail
              mkdir -p dist
              echo "OpenBSD build skipped - OpenCASCADE not available" > dist/README-openbsd.txt
            fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hippo3D-openbsd-x64
          path: dist/*
          if-no-files-found: warn

  # ========================================================================
  # 7. Create GitHub Release with all artifacts (only on tags)
  # ========================================================================
  release:
    name: Attach artifacts to GitHub Release
    needs: [linux-x64, macos-x64, macos-arm64, windows-x64, freebsd-x64, openbsd-x64]
    runs-on: ubuntu-latest
    # Only run when a tag starting with 'v' is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lah artifacts/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
