name: Build macOS addon

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIPs to the wip-0.3.0 GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  OCCT_VERSION: '8.0.0'
  TARGET_VERSION: '0.3.0'
  FLAVOR: 'wip'

jobs:
  build-macos:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
        platform: [macos-arm64, macos-x86_64]
        python_version: ['3.11.9', '3.13.13']
        blender_version: ['4.5.0', '5.2.0']
        include:
          # macos-latest (macOS 26 arm64 as of mid-2026) can cross-compile
          # x86_64 but cannot run the x86_64 native module for smoke tests.
          # Use the last Intel runner for the Intel build so the smoke test
          # runs on the correct architecture.
          - { arch: arm64,  runs-on: macos-latest }
          - { arch: x86_64, runs-on: macos-15-intel }
        exclude:
          - arch: arm64
            platform: macos-x86_64
          - arch: x86_64
            platform: macos-arm64
          # Blender discontinued Intel macOS support in Blender 5.x. Intel
          # builds target the last Intel-compatible LTS (4.5.x) with Python 3.11.
          - arch: x86_64
            blender_version: '5.2.0'
          - arch: x86_64
            python_version: '3.13.13'
          # Apple Silicon builds target the current Blender 5.2 with Python 3.13.
          - arch: arm64
            blender_version: '4.5.0'
          - arch: arm64
            python_version: '3.11.9'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The repo currently references an opennurbs commit that does not exist on
      # the public remote. Reset to the last known buildable commit.
      - name: Fix opennurbs submodule
        run: |
          cd native/third_party/opennurbs
          git fetch origin
          git checkout 2fc39db962678b44ee710f887a04fc38f8d4b883

      - name: Install Python ${{ matrix.python_version }}
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          # Intel macOS is supported up to Blender 4.5 LTS, which still bundles
          # Python 3.11. The Python.org 3.11 macOS installer targets macOS 11,
          # which is compatible with Blender 4.5's requirements.
          # Python.org macOS packages are named macos11.pkg; there is no
          # macos13 variant. The arm64 slice is included in the universal2
          # installer, so this single package works for both architectures.
          MACOS_PKG_VERSION="11"
          INSTALLER="python-${PYTHON_VERSION}-macos${MACOS_PKG_VERSION}.pkg"
          curl -L -o "/tmp/${INSTALLER}" "https://www.python.org/ftp/python/${PYTHON_VERSION}/${INSTALLER}"
          sudo installer -pkg "/tmp/${INSTALLER}" -target /
          # The python.org installer puts binaries under /Library/Frameworks/Python.framework/Versions/${PY_SHORT}
          echo "/Library/Frameworks/Python.framework/Versions/${PY_SHORT}/bin" >> "$GITHUB_PATH"
          echo "PYTHON_BIN=/Library/Frameworks/Python.framework/Versions/${PY_SHORT}/bin/python${PY_SHORT}" >> "$GITHUB_ENV"
          # Expose the framework root so CMake links against the same libPython
          # used at runtime.  Pybind11's CMake logic needs this to be consistent
          # with the interpreter we pass via -DPython_EXECUTABLE.
          echo "Python_ROOT_DIR=/Library/Frameworks/Python.framework/Versions/${PY_SHORT}" >> "$GITHUB_ENV"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          BLENDER_VERSION: ${{ matrix.blender_version }}

      - name: Install pybind11 and CMake
        run: |
          "$PYTHON_BIN" -m ensurepip --upgrade
          "$PYTHON_BIN" -m pip install --upgrade pip pybind11
          brew install cmake ninja

      - name: Build OCCT ${{ env.OCCT_VERSION }} for ${{ matrix.arch }}
        env:
          OSX_ARCH: ${{ matrix.arch }}
          BLENDER_VERSION: ${{ matrix.blender_version }}
        run: |
          chmod +x native/build_occt.sh
          # macOS deployment target: 4.5 LTS supports 11.0 (Intel), 5.2 requires 13.0.
          if [ "${BLENDER_VERSION%%.*}" = "4" ]; then
            TARGET_DEPLOYMENT="11.0"
          else
            TARGET_DEPLOYMENT="13.0"
          fi
          export DEPLOYMENT_TARGET="${TARGET_DEPLOYMENT}"
          OSX_ARCH="${OSX_ARCH}" ./native/build_occt.sh
          echo "OCCT_ROOT=$(pwd)/native/third_party/occt-${OCCT_VERSION}-${OSX_ARCH}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_TARGET=${TARGET_DEPLOYMENT}" >> "$GITHUB_ENV"

      - name: Build Hippo3D native module for ${{ matrix.arch }}
        env:
          OSX_ARCH: ${{ matrix.arch }}
          PLATFORM_FOLDER: ${{ matrix.platform }}
          PYTHON_VERSION: ${{ matrix.python_version }}
          OCCT_ROOT: ${{ env.OCCT_ROOT }}
          Python_ROOT_DIR: ${{ env.Python_ROOT_DIR }}
        run: |
          chmod +x native/build_macos.sh
          cd native
          OSX_ARCH="${OSX_ARCH}" PLATFORM_FOLDER="${PLATFORM_FOLDER}" DEPLOYMENT_TARGET="${DEPLOYMENT_TARGET}" PYTHON_BIN="${PYTHON_BIN}" BUNDLE_AUTO=1 ./build_macos.sh
      - name: Inspect macOS native bundle
        run: |
          NATIVE_DIR="native/${{ matrix.platform }}"

          echo "===== Native directory ====="
          ls -lah "$NATIVE_DIR"

          echo
          echo "===== Dylibs ====="
          find "$NATIVE_DIR" -maxdepth 1 \
            \( -type f -o -type l \) \
            -name '*.dylib' \
            -print

          echo
          echo "===== Module dependencies ====="
          otool -L "$NATIVE_DIR"/hippo_occ_core*.so

          echo
          echo "===== Module RPATH ====="
          otool -l "$NATIVE_DIR"/hippo_occ_core*.so \
            | grep -A3 LC_RPATH || true

        - name: Package add-on for ${{ matrix.arch }}
              env:
                OSX_ARCH: ${{ matrix.arch }}
                VERSION: ${{ env.TARGET_VERSION }}
                FLAVOR: ${{ env.FLAVOR }}
                PYTHON_VERSION: ${{ matrix.python_version }}
              run: |
                PY_SHORT="${PYTHON_VERSION%.*}"
                PY_TAG="${PY_SHORT//./}"
                ZIP_BASE="Hippo3D-v${VERSION}-${FLAVOR}-${{ matrix.platform }}-python${PY_TAG}"
                chmod +x native/package_macos.sh
                cd native
                OSX_ARCH="${OSX_ARCH}" VERSION="${VERSION}" FLAVOR="${FLAVOR}" ZIP_BASE="${ZIP_BASE}" ./package_macos.sh

      - name: Smoke-test native module import
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          ZIP="dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${{ matrix.platform }}-python${PY_TAG}.zip"
          TMPDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMPDIR"
          NATIVE_DIR="$TMPDIR/Hippo3D/native/${{ matrix.platform }}"
          "$PYTHON_BIN" - "$NATIVE_DIR" <<'PY'
          import sys, glob, importlib.util
          native_dir = sys.argv[1]
          mods = sorted(glob.glob(native_dir + '/hippo_occ_core*.so'))
          if not mods:
              raise SystemExit('No native module found')
          mod_path = mods[-1]
          print('Testing import of', mod_path)
          spec = importlib.util.spec_from_file_location('hippo_occ_core', mod_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['hippo_occ_core'] = mod
          spec.loader.exec_module(mod)
          print('SUCCESS:', mod.make_box_mesh(1,1,1).keys())
          PY
          rm -rf "$TMPDIR"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Verify ZIP exists
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          ZIP="dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${{ matrix.platform }}-python${PY_TAG}.zip"
          ls -lh "$ZIP"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-python${{ matrix.python_version }}-addon
          path: dist/Hippo3D-v${{ env.TARGET_VERSION }}-${{ env.FLAVOR }}-${{ matrix.platform }}-python*.zip

      - name: Clean up stale release assets
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          chmod +x .github/scripts/cleanup_release_assets.sh
          .github/scripts/cleanup_release_assets.sh "$TARGET_VERSION" "$FLAVOR" "${{ matrix.platform }}" "$PY_TAG"

      - name: Upload to GitHub release
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_SHORT="${PYTHON_VERSION%.*}"
          PY_TAG="${PY_SHORT//./}"
          gh release upload "wip-${TARGET_VERSION}" "dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${{ matrix.platform }}-python${PY_TAG}.zip" --clobber
