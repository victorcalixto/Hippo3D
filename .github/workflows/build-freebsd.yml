name: Build FreeBSD addon

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIP to the wip-0.3.0 GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

env:
  TARGET_VERSION: '0.3.0'
  FLAVOR: 'wip'
  HIPPO_PLATFORM: 'freebsd-x64'

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FreeBSD Blender 5.0.1 uses Python 3.11.15.
        python_version: ['3.11']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: freebsd
          version: '15.1'
          architecture: x86-64
          shell: bash
          memory: 6G
          cpu_count: 4

      - name: Install dependencies and build in FreeBSD VM
        shell: cpa.sh {0} --environment-variables TARGET_VERSION FLAVOR HIPPO_PLATFORM PYTHON_VERSION
        env:
          TARGET_VERSION: ${{ env.TARGET_VERSION }}
          FLAVOR: ${{ env.FLAVOR }}
          HIPPO_PLATFORM: ${{ env.HIPPO_PLATFORM }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          set -euo pipefail
          export IGNORE_OSVERSION=yes
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR%%.*}"
          # pybind11 is installed via pip inside the build script if needed.
          sudo pkg install -y git cmake ninja "python${PY_TAG}" opencascade zip patchelf

          # FreeBSD's python package may not include pip. Bootstrap it with
          # ensurepip (or get-pip.py as a fallback) so pybind11 can install.
          "python${PYTHON_VERSION}" -m ensurepip --upgrade || {
            fetch -o /tmp/get-pip.py "https://bootstrap.pypa.io/get-pip.py"
            "python${PYTHON_VERSION}" /tmp/get-pip.py --break-system-packages
          }

          cd "$GITHUB_WORKSPACE/native/third_party/opennurbs"
          git fetch origin
          git checkout 2fc39db962678b44ee710f887a04fc38f8d4b883

          cd "$GITHUB_WORKSPACE/native"
          chmod +x ./build_freebsd.sh
          PYTHON_BIN="/usr/local/bin/python${PYTHON_VERSION}" BUNDLE_AUTO=1 ./build_freebsd.sh

          cd "$GITHUB_WORKSPACE/native"
          chmod +x ./package_bsd.sh
          VERSION="$TARGET_VERSION" FLAVOR="$FLAVOR" PLATFORM="$HIPPO_PLATFORM" ZIP_BASE="Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}" ./package_bsd.sh

      - name: Smoke-test native module import in FreeBSD VM
        shell: cpa.sh {0} --environment-variables TARGET_VERSION FLAVOR HIPPO_PLATFORM PYTHON_VERSION
        env:
          TARGET_VERSION: ${{ env.TARGET_VERSION }}
          FLAVOR: ${{ env.FLAVOR }}
          HIPPO_PLATFORM: ${{ env.HIPPO_PLATFORM }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          set -euo pipefail
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR%%.*}"
          ZIP="$GITHUB_WORKSPACE/dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}.zip"
          TMPDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMPDIR"
          NATIVE_DIR="$TMPDIR/Hippo3D/native/${HIPPO_PLATFORM}"
          "python${PYTHON_VERSION}" - "$NATIVE_DIR" <<'PY'
          import sys, glob, importlib.util
          native_dir = sys.argv[1]
          mods = sorted(glob.glob(native_dir + '/hippo_occ_core*.so'))
          if not mods:
              raise SystemExit('No native module found')
          mod_path = mods[-1]
          print('Testing import of', mod_path)
          spec = importlib.util.spec_from_file_location('hippo_occ_core', mod_path)
          mod = importlib.util.module_from_spec(spec)
          sys.modules['hippo_occ_core'] = mod
          spec.loader.exec_module(mod)
          print('SUCCESS:', mod.make_box_mesh(1,1,1).keys())
          PY
          rm -rf "$TMPDIR"

      - name: Verify ZIP exists
        run: |
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR%%.*}"
          ls -lh "$GITHUB_WORKSPACE/dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}.zip"
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HIPPO_PLATFORM }}-python${{ matrix.python_version }}-addon
          path: dist/Hippo3D-v${{ env.TARGET_VERSION }}-${{ env.FLAVOR }}-${{ env.HIPPO_PLATFORM }}-python*.zip

      - name: Clean up stale release assets
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR%%.*}"
          chmod +x .github/scripts/cleanup_release_assets.sh
          .github/scripts/cleanup_release_assets.sh "$TARGET_VERSION" "$FLAVOR" "$HIPPO_PLATFORM" "$PY_TAG"

      - name: Upload to GitHub release
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          PY_MAJOR="${PYTHON_VERSION%%.*}"
          PY_MINOR="${PYTHON_VERSION#*.}"
          PY_TAG="${PY_MAJOR}${PY_MINOR%%.*}"
          gh release upload "wip-${TARGET_VERSION}" \
            "dist/Hippo3D-v${TARGET_VERSION}-${FLAVOR}-${HIPPO_PLATFORM}-python${PY_TAG}.zip" --clobber
